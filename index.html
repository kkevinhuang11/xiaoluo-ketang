<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小罗课堂 · MCE 在线题库（演示版）</title>
<style>:root{
  --pri:#0B41CD;--pri-d:#022366;--pri-l:#E8EEFC;--ok:#0A8754;--ok-l:#E6F5EE;--bad:#C8102E;--bad-l:#FCEBEE;
  --warn:#B45309;--warn-l:#FEF3E2;--tx:#1A2233;--tx2:#4B5565;--tx3:#8A93A3;--bd:#E3E7EE;--bg:#F4F6FA;--card:#fff;
  --font:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:#EDF0F5;color:var(--tx);font-size:14px}
button{font-family:inherit;cursor:pointer}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--pri-d);color:#fff;display:flex;align-items:center;gap:28px;padding:0 28px;height:56px}
.topbar h1{font-size:16px;font-weight:700;white-space:nowrap}
.topbar h1 small{font-weight:400;opacity:.7;margin-left:8px;font-size:12px}
.tabs{display:flex;gap:4px;height:100%}
.tabs button{background:none;border:none;color:rgba(255,255,255,.72);font-size:14px;padding:0 16px;height:100%;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#7FA3FF;font-weight:700}
.topbar .meta{margin-left:auto;font-size:12px;opacity:.7;white-space:nowrap}
.tab{display:none;padding:28px;max-width:1440px;margin:0 auto}
.tab.on{display:block}
.sec-title{font-size:18px;font-weight:700;margin-bottom:6px}
.sec-sub{font-size:13px;color:var(--tx2);margin-bottom:20px;line-height:1.7}
/* ---------- 可交互页：三栏 ---------- */
.live{display:grid;grid-template-columns:230px 395px 1fr;gap:28px;align-items:start}
.idx{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--bd);position:sticky;top:84px}
.idx h4{font-size:12px;color:var(--tx3);font-weight:600;margin:10px 4px 6px}
.idx h4:first-child{margin-top:0}
.idx a{display:flex;gap:8px;align-items:baseline;padding:7px 8px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:13px;cursor:pointer;line-height:1.4}
.idx a:hover{background:var(--bg)}
.idx a.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.idx a code{font-family:Consolas,monospace;font-size:11px;color:var(--tx3);min-width:28px}
.idx a.on code{color:var(--pri)}
.idx .reset{margin-top:12px;width:100%;border:1px dashed var(--bd);background:#fff;border-radius:8px;padding:7px;font-size:12px;color:var(--tx2)}
.notes{background:#fff;border-radius:12px;padding:22px 24px;border:1px solid var(--bd);position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
.notes .pid{display:inline-block;font-family:Consolas,monospace;background:var(--pri);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;margin-right:8px}
.notes h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center}
.notes h5{font-size:13px;color:var(--pri-d);margin:18px 0 8px;padding-left:8px;border-left:3px solid var(--pri)}
.notes ul{padding-left:18px;line-height:1.75;font-size:13px;color:var(--tx2)}
.notes li{margin-bottom:3px}
.notes .fid{display:inline-block;font-family:Consolas,monospace;font-size:11px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--tx)}
.notes .diff li::marker{content:"▸ ";color:var(--warn)}
/* ---------- 手机外框 ---------- */
.phone{width:395px;height:800px;border:11px solid #1C2330;border-radius:46px;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(2,35,102,.18)}
.phone.mini{transform:scale(.78);transform-origin:top left;pointer-events:none}
.mini-wrap{width:308px;height:624px;overflow:hidden}
.sbar{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11px;font-weight:600;background:#fff}
.wxnav{height:44px;background:#fff;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--bd);position:relative}
.wxnav .back{font-size:24px;width:28px;color:var(--tx);line-height:1;cursor:pointer}
.wxnav .ttl{position:absolute;left:0;right:0;text-align:center;font-size:15px;font-weight:600;pointer-events:none}
.wxnav .cap{margin-left:auto;border:1px solid #D5D9E0;border-radius:15px;padding:3px 10px;font-size:12px;color:#333;display:flex;gap:8px;align-items:center;background:#fff;z-index:1}
.scr{flex:1;overflow-y:auto;position:relative}
.scr::-webkit-scrollbar{width:0}
.pad{padding:14px}
/* 底部栏 */
.tabbar{height:58px;background:#fff;border-top:1px solid var(--bd);display:flex}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--tx3);cursor:pointer;gap:2px}
.tabbar div i{font-style:normal;font-size:18px}
.tabbar div.on{color:var(--pri);font-weight:600}
.actbar{background:#fff;border-top:1px solid var(--bd);display:flex;gap:8px;padding:10px 12px 14px}
.btn{border:none;border-radius:22px;padding:11px 14px;font-size:14px;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;flex:1}
.btn.pri:disabled{background:#AFC0EC}
.btn.sec{background:#F1F3F7;color:var(--tx);border:1px solid var(--bd)}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
/* 首页 */
.hero{background:linear-gradient(135deg,#0B41CD,#1E5BE6);color:#fff;padding:16px 16px 56px}
.hero h2{font-size:18px}
.hero p{font-size:12px;opacity:.82;margin-top:4px}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:20px;padding:3px;margin-top:14px}
.seg div{flex:1;text-align:center;padding:7px 0;font-size:13px;border-radius:17px;cursor:pointer;color:rgba(255,255,255,.85)}
.seg div.on{background:#fff;color:var(--pri);font-weight:700}
.ov{background:#fff;border-radius:14px;margin:-44px 14px 0;padding:14px 16px;box-shadow:0 4px 14px rgba(2,35,102,.08);position:relative}
.ov .nums{display:flex}
.ov .nums div{flex:1;text-align:center}
.ov .nums b{display:block;font-size:22px;font-family:Consolas,"Microsoft YaHei",monospace;color:var(--tx)}
.ov .nums span{font-size:11px;color:var(--tx3)}
.ov .bar{height:6px;background:var(--bg);border-radius:3px;margin:12px 0 6px;overflow:hidden}
.ov .bar i{display:block;height:100%;background:var(--pri);border-radius:3px}
.ov .tip{font-size:11px;color:var(--tx3);display:flex;justify-content:space-between}
.cont{margin:12px 14px 0;background:var(--pri-l);border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cont span{font-size:13px;color:var(--pri-d)}
.cont b{font-size:12px;color:var(--pri)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 14px 0}
.quick div{background:#fff;border-radius:12px;padding:11px 0 9px;text-align:center;font-size:12px;cursor:pointer;border:1px solid var(--bd);position:relative}
.quick div i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.quick .badge{position:absolute;top:5px;right:8px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 16px 8px}
.mhead h4{font-size:15px}
.mhead span{font-size:11px;color:var(--tx3)}
.mod{background:#fff;margin:0 14px 8px;border-radius:12px;padding:12px 14px;border:1px solid var(--bd);cursor:pointer}
.mod .r1{display:flex;justify-content:space-between;align-items:center}
.mod .r1 b{font-size:14px;font-weight:600}
.mod .r1 span{font-size:11px;color:var(--tx3)}
.mod .r2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--tx3)}
.mod .r2 .bar{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.mod .r2 .bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:10px;border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:600;vertical-align:1px}
.tag.new{background:var(--warn-l);color:var(--warn)}
.tag.grp{background:var(--pri-l);color:var(--pri)}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.subs span{font-size:11px;background:var(--bg);border-radius:12px;padding:3px 9px;color:var(--tx2);cursor:pointer}
.foot{font-size:11px;color:var(--tx3);text-align:center;padding:14px 0 18px;line-height:1.7}
/* 答题页 */
.qtop{background:#fff;padding:10px 14px 12px;border-bottom:1px solid var(--bd)}
.mode-seg{display:flex;background:var(--bg);border-radius:16px;padding:3px;width:150px}
.mode-seg div{flex:1;text-align:center;font-size:12px;padding:4px 0;border-radius:13px;cursor:pointer;color:var(--tx2)}
.mode-seg div.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtop .row{display:flex;justify-content:space-between;align-items:center}
.qtop .cnt{font-size:12px;color:var(--tx3);font-family:Consolas,monospace}
.qtop .prog{height:4px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden}
.qtop .prog i{display:block;height:100%;background:var(--pri)}
.exam-head{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.exam-head b{color:var(--pri)}
.qcard{background:#fff;border-radius:14px;margin:12px;padding:16px;border:1px solid var(--bd)}
.qmeta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tt{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px}
.tt.single{background:#E0EDFF;color:#1D4ED8}.tt.multi{background:#FEF0D9;color:#B45309}
.tt.judge{background:#EFE6FD;color:#7C3AED}.tt.fill{background:#FCE4F0;color:#BE185D}
.qmeta .mname{font-size:11px;color:var(--tx3)}
.qmeta .star{margin-left:auto;font-size:16px;cursor:pointer;color:#C3C9D4}
.qmeta .star.on{color:#F5A623}
.hint{font-size:11px;color:var(--warn);background:var(--warn-l);border-radius:6px;padding:5px 8px;margin-bottom:10px}
.stem{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:8px;font-size:14px;line-height:1.5;cursor:pointer;position:relative;background:#fff}
.opt .code{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid #B8C0CC;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2)}
.opt.multi .code{border-radius:5px}
.opt.sel{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.opt.sel .code{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-l);color:#065F3C}
.opt.ok .code{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-l);color:#8A0B20}
.opt.bad .code{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border:1.5px dashed var(--ok);background:#fff;color:#065F3C}
.opt.miss .code{border-color:var(--ok);color:var(--ok)}
.opt .flag{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.opt.miss .flag{background:var(--ok-l);color:var(--ok)}
.opt.bad .flag{background:#fff;color:var(--bad)}
.opt.dim{opacity:.6}
.judge{display:flex;gap:10px;margin-bottom:6px}
.judge div{flex:1;border:1px solid var(--bd);border-radius:10px;padding:14px 0;text-align:center;font-size:15px;font-weight:600;cursor:pointer}
.judge div.sel{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.judge div.ok{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.judge div.bad{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.blanks{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.blanks label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3)}
.blanks input{flex:1;border:1px solid var(--bd);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none}
.blanks input:focus{border-color:var(--pri)}
.blanks input.ok{border-color:var(--ok);background:var(--ok-l)}
.blanks input.bad{border-color:var(--bad);background:var(--bad-l)}
.res{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.res.ok{background:var(--ok-l);color:var(--ok)}
.res.bad{background:var(--bad-l);color:var(--bad)}
.res.self{background:var(--warn-l);color:var(--warn)}
.selfbox{border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--tx2);line-height:1.6}
.selfbox .bs{display:flex;gap:8px;margin-top:8px}
.selfbox button{flex:1;border-radius:16px;padding:7px;font-size:12px;border:1px solid var(--bd);background:#fff}
.selfbox button.y{border-color:var(--ok);color:var(--ok)}
.exp{background:#F7F9FC;border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.7;border-left:3px solid var(--pri)}
.exp .ans{font-weight:700;margin-bottom:4px}
.exp .ph{color:var(--tx3)}
.exp .src{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-size:11px;color:var(--tx3);display:flex;justify-content:space-between;gap:8px}
.exp .src a{color:var(--pri);text-decoration:none;cursor:pointer;white-space:nowrap}
/* 题卡 */
.sheet-mask{position:absolute;inset:0;background:rgba(10,20,40,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px 20px;max-height:72%;display:flex;flex-direction:column}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .hd b{font-size:15px}
.sheet .hd span{font-size:20px;cursor:pointer;color:var(--tx3)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--tx2);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--bg);border-radius:14px;padding:4px 11px;cursor:pointer;color:var(--tx2);border:1px solid transparent}
.chip.on{background:var(--pri-l);color:var(--pri);border-color:var(--pri);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow-y:auto}
.grid div{height:38px;border-radius:8px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;position:relative;font-family:Consolas,monospace}
.grid div.ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.grid div.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.grid div.cur{outline:2px solid var(--pri);outline-offset:1px}
.grid div.st::after{content:"★";position:absolute;top:-3px;right:1px;font-size:9px;color:#F5A623}
/* 自测 / 结果 / 错题 / 我的 */
.card{background:#fff;border-radius:14px;margin:12px;padding:14px 16px;border:1px solid var(--bd)}
.card h4{font-size:14px;margin-bottom:10px}
.card .note{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:8px}
.score{text-align:center;padding:22px 0 8px}
.ring{width:132px;height:132px;margin:0 auto}
.score .sub{font-size:13px;color:var(--tx2);margin-top:6px}
.mbar{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:9px}
.mbar span:first-child{width:96px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.mbar .bar i{display:block;height:100%;border-radius:4px}
.mbar b{width:56px;text-align:right;font-family:Consolas,monospace;font-size:12px}
.witem{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer;align-items:flex-start}
.witem:first-of-type{border-top:none}
.witem .t{flex:1;font-size:13px;line-height:1.5}
.witem .m{font-size:11px;color:var(--tx3);margin-top:3px}
.witem .go{font-size:12px;color:var(--pri);white-space:nowrap}
.streak{display:inline-flex;gap:3px;vertical-align:-1px;margin-left:4px}
.streak i{width:7px;height:7px;border-radius:50%;background:var(--bd)}
.streak i.on{background:var(--ok)}
.empty{text-align:center;color:var(--tx3);padding:40px 0;font-size:13px;line-height:1.8}
.empty i{font-style:normal;font-size:34px;display:block;margin-bottom:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--bd);font-size:13px}
.lrow:first-of-type{border-top:none}
.lrow span{color:var(--tx3);font-size:12px}
.lrow.btnrow{cursor:pointer}
.qrph{width:120px;height:120px;margin:4px auto 8px;display:block}
.url{font-family:Consolas,monospace;font-size:11px;color:var(--tx2);text-align:center;word-break:break-all}
.toast{position:absolute;left:50%;top:46%;transform:translateX(-50%);background:rgba(20,28,44,.88);color:#fff;font-size:12px;border-radius:8px;padding:9px 14px;z-index:40;max-width:80%;text-align:center;line-height:1.5}
.stepper{display:flex;gap:8px}
.stepper div{flex:1;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer}
.stepper div.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri);font-weight:700}
.switch{width:38px;height:22px;border-radius:11px;background:var(--bd);position:relative;cursor:pointer}
.switch.on{background:var(--pri)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.switch.on::after{left:18px}
/* ---------- 页面一览 ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(308px,1fr));gap:28px 22px}
.gcell .cap{font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.gcell .cap code{font-family:Consolas,monospace;background:var(--pri);color:#fff;border-radius:5px;padding:1px 6px;font-size:11px}
.gcell .cap span{color:var(--tx3);font-size:12px}
/* ---------- 流程图 ---------- */
.flowbox{background:#fff;border-radius:14px;border:1px solid var(--bd);padding:20px;overflow-x:auto}
.flowbox svg{display:block;min-width:1180px;width:100%;height:auto}
/* ---------- 管理侧 ---------- */
.desk{background:#fff;border-radius:14px;border:1px solid var(--bd);margin-bottom:28px;overflow:hidden}
.desk .dh{background:#F7F9FC;border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;align-items:center;gap:10px}
.desk .dh code{font-family:Consolas,monospace;background:var(--pri-d);color:#fff;border-radius:5px;padding:1px 7px;font-size:12px}
.desk .dh b{font-size:15px}
.desk .dh span{font-size:12px;color:var(--tx3);margin-left:auto}
.desk .db{padding:20px 22px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.tile{border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.tile .v{font-size:28px;font-weight:700;font-family:Consolas,"Microsoft YaHei",monospace;text-align:right}
.tile .v small{font-size:12px;color:var(--tx3);font-weight:400;margin-left:3px}
.tile .k{font-size:12px;color:var(--tx2)}
.tile.e .v{color:var(--bad)}.tile.w .v{color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#F1F4F9;text-align:left;font-weight:600;padding:9px 10px;color:var(--tx2);font-size:12px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #EEF1F5;vertical-align:top;line-height:1.5}
table.t td.n{text-align:right;font-family:Consolas,monospace}
table.t td.z{color:#C3C9D4}
.lv{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.lv.error{background:var(--bad-l);color:var(--bad)}.lv.warn{background:var(--warn-l);color:var(--warn)}
.hit{display:inline-block;font-family:Consolas,monospace;font-size:11px;border-radius:4px;padding:0 5px;margin:0 3px 2px 0;background:var(--bg);border:1px solid var(--bd)}
.hit.error{border-color:#F3B6C0;color:var(--bad)}
.filters{display:flex;gap:8px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.filters select{font-family:inherit;font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:5px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.steps{display:flex;gap:0;align-items:stretch}
.step{flex:1;border:1px solid var(--bd);border-radius:12px;padding:14px;position:relative;background:#fff}
.step+.arrow{display:none}
.arrow{width:28px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:18px;flex-shrink:0}
.step b{display:block;font-size:13px;margin-bottom:6px;color:var(--pri-d)}
.step .who{font-size:11px;color:var(--pri);margin-bottom:6px}
.step p{font-size:12px;color:var(--tx2);line-height:1.6}
.step .gate{margin-top:8px;font-size:11px;color:var(--ok);background:var(--ok-l);border-radius:6px;padding:4px 7px;line-height:1.5}
/* ---------- 二期线框 ---------- */
.wf .phone{filter:grayscale(1)}
.wfgrid{display:grid;grid-template-columns:repeat(3,308px) 1fr;gap:22px;align-items:start}
.wbox{border:1.5px dashed #AEB6C2;border-radius:10px;padding:10px;margin:10px 12px;color:#6B7280;font-size:12px;line-height:1.6;background:#fff}
.wline{height:10px;background:#E5E7EB;border-radius:5px;margin:7px 0}
.wbtn{background:#9CA3AF;color:#fff;border-radius:20px;text-align:center;padding:10px;font-size:13px;margin:12px}
.dash{background:#fff;border:1.5px dashed #AEB6C2;border-radius:14px;padding:18px;filter:grayscale(1)}
.dash h4{font-size:15px;margin-bottom:12px}
.dash .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.dash .kpis div{border:1px solid #D1D5DB;border-radius:10px;padding:10px;font-size:12px;color:#6B7280}
.dash .kpis b{display:block;font-size:20px;color:#374151;margin-top:4px}
.heat td{width:44px;height:26px;border:2px solid #fff;border-radius:4px}
.p2note{font-size:12px;color:var(--tx2);line-height:1.7;margin-top:10px}
@media (max-width:900px){
  .topbar{gap:12px;padding:0 12px;overflow-x:auto}.topbar .meta{display:none}
  .live{grid-template-columns:1fr}.idx,.notes{position:static}
  .phone{margin:0 auto}
}
.grid div.sel{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.btn:disabled{opacity:.45}

@media (max-width:520px){#phone-live{padding:0}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}}

<script>// ================= 学员端：状态 + 渲染 + 交互 =================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LETTER = i => String.fromCharCode(65 + i);
const ROLE_NAME = { eco: '生态岗', channel: '渠道岗' };
const TYPE_NAME = { single: '单选题', multi: '多选题', judge: '判断题', fill: '填空题' };
const QMAP = {};
for (const r in DATA.samples) DATA.samples[r].forEach(q => { QMAP[q.id] = q; });
const LS_KEY = 'xiaoluo-demo:v1';
const short = m => String(m || '').replace(/^MCE准入-/, '准入·').replace('相关题目', '');

// 原型演示用的模块进度（不是业务数据）
const FR = [0.9, 0.55, 0.35, 0.75, 0.2, 0.6, 0.45, 0.8, 0.3, 0.65, 0.5];
const SEED = {};
for (const r in DATA.modules) DATA.modules[r].forEach((m, i) => {
  const done = Math.round(m.count * FR[i % FR.length]);
  SEED[r + '|' + m.name] = { done, right: Math.round(done * (0.68 + 0.04 * (i % 5))) };
});
const DEMO_REC = {
  'E-ZR-047': { times: 2, wrong: 2, streak: 0, last: 'bad' }, 'E-XYJ-170': { times: 1, wrong: 1, streak: 0, last: 'bad' },
  'E-ZR-056': { times: 3, wrong: 2, streak: 1, last: 'ok' }, 'E-XYJ-120': { times: 1, wrong: 1, streak: 0, last: 'bad' },
  'E-CEO-001': { times: 1, wrong: 0, streak: 1, last: 'ok' },
  'C-GY-029': { times: 1, wrong: 1, streak: 0, last: 'bad' }, 'C-BJ-011': { times: 2, wrong: 1, streak: 1, last: 'ok' },
  'C-HG-049': { times: 1, wrong: 1, streak: 0, last: 'bad' }, 'C-YY-077': { times: 1, wrong: 1, streak: 0, last: 'bad' },
};
const DEMO_STAR = { 'E-ZR-047': true, 'C-GY-036': true };

function blankState() {
  return { role: 'eco', page: 'home', mode: 'practice', list: [], idx: 0, module: null, sheet: false, sheetF: 'all',
    draft: {}, sub: {}, exam: null, setup: { mods: [], n: 10, timer: true }, toast: '', lastPos: null, rec: {}, star: {} };
}
let S = blankState();
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw); S.rec = d.rec || {}; S.star = d.star || {}; S.lastPos = d.lastPos || null;
  } catch (e) { /* 隐私模式下 localStorage 不可用：只在内存里跑 */ }
}
function save() { if (window.__nosave) return; try { localStorage.setItem(LS_KEY, JSON.stringify({ rec: S.rec, star: S.star, lastPos: S.lastPos })); } catch (e) {} }

// ---------- 判分 ----------
function norm(s) { return String(s || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/\s+/g, '').toLowerCase(); }
function hasAns(q, a) { if (!q) return false; if (q.type === 'fill') return !!a && a.some(x => String(x || '').trim()); return !!a; }
function grade(q, a) {
  if (!hasAns(q, a)) return false;
  if (q.type === 'fill') return q.blanks.every((b, i) => norm(a[i]) === norm(b));
  if (q.type === 'multi') return [...a].sort().join('') === [...q.answer].sort().join('');
  return a === q.answer;
}
function fmtAns(q, a) {
  if (q.type === 'judge') return a === 'T' ? '正确' : a === 'F' ? '错误' : '未作答';
  if (q.type === 'fill') return (a || []).filter(x => x).length ? a.join('；') : '未作答';
  return a || '未作答';
}
function record(st, qid, ok) {
  const r = st.rec[qid] || { times: 0, wrong: 0, streak: 0 };
  r.times++; if (ok) r.streak++; else { r.wrong++; r.streak = 0; } r.last = ok ? 'ok' : 'bad';
  st.rec[qid] = r; if (st === S) save();
}
const samples = st => DATA.samples[st.role];
const inWrong = (st, id) => { const r = st.rec[id]; return !!r && r.wrong > 0 && r.streak < 2; };
const wrongList = st => samples(st).filter(q => inWrong(st, q.id));
const curQ = st => QMAP[st.list[st.idx]];
function elapsed(st) {
  if (!st.exam) return '00:00';
  if (st.exam.fixed) return st.exam.fixed;
  const s = Math.floor((Date.now() - st.exam.start) / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function stats(st) {
  let done = 0, right = 0;
  const mods = DATA.modules[st.role].map((m, i) => {
    let d = 0, rt = 0;
    samples(st).filter(q => q.module === m.name && st.rec[q.id]).forEach(q => { d = Math.min(m.count, d + 1); if (st.rec[q.id].last === 'ok') rt++; });
    rt = Math.min(rt, d); done += d; right += rt;
    return { ...m, i, done: d, right: rt, updated: samples(st).some(q => q.module === m.name && q.updated) };
  });
  return { done, right, total: DATA.totals[st.role], mods, wrong: wrongList(st).length };
}

// ---------- 屏幕 ----------
function renderScreen(st) {
  let body = '', bottom = '', title = '', back = false;
  if (st.page === 'home') { title = '小罗课堂'; body = scrHome(st); bottom = tabbar('home'); }
  else if (st.page === 'quiz') { const r = scrQuiz(st); body = r.body; bottom = r.bottom; title = r.title; back = true; }
  else if (st.page === 'setup') {
    title = '自测卷'; back = true; body = scrSetup(st); const n = setupList(st).length;
    bottom = `<div class="actbar"><button class="btn pri" ${n ? '' : 'disabled'} onclick="act('startExam')">开始自测（${n} 题）</button></div>`;
  }
  else if (st.page === 'result') { title = '自测结果'; back = true; body = scrResult(st); bottom = `<div class="actbar"><button class="btn sec" onclick="act('go','home')">返回首页</button><button class="btn pri" ${st.exam.result.wrong.length ? '' : 'disabled'} onclick="act('redoExamWrong')">重练错题（${st.exam.result.wrong.length}）</button></div>`; }
  else if (st.page === 'wrong') { title = '错题本'; body = scrWrong(st); bottom = tabbar('wrong'); }
  else if (st.page === 'me') { title = '我的'; body = scrMe(st); bottom = tabbar('me'); }
  return `<div class="sbar"><span>9:41</span><span>5G ▮▮▮</span></div>
  <div class="wxnav">${back ? `<span class="back" onclick="act('back')">‹</span>` : ''}<div class="ttl">${esc(title)}</div><div class="cap">··· <span style="color:#ccc">|</span> ◉</div></div>
  <div class="scr">${body}</div>${bottom}${st.sheet ? scrSheet(st) : ''}${st.toast ? `<div class="toast">${esc(st.toast)}</div>` : ''}`;
}
function tabbar(on) {
  const it = [['home', '🏠', '首页'], ['wrong', '📕', '错题本'], ['me', '👤', '我的']];
  return `<div class="tabbar">${it.map(([k, i, l]) => `<div class="${on === k ? 'on' : ''}" onclick="act('go','${k}')"><i>${i}</i>${l}</div>`).join('')}</div>`;
}
function modCard(m) {
  const pct = m.done ? Math.round(m.right / m.done * 100) : 0;
  return `<div class="mod" onclick="act('enterMod',${m.i})"><div class="r1"><b>${esc(short(m.name))}${m.updated ? '<span class="tag new">更新</span>' : ''}</b><span>${m.count} 题</span></div>
  <div class="r2"><div class="bar"><i style="width:${m.done / m.count * 100}%"></i></div><span>${m.done}/${m.count}</span><span>正确率 ${pct}%</span></div></div>`;
}
function grpCard(ms) {
  const cnt = ms.reduce((a, m) => a + m.count, 0), done = ms.reduce((a, m) => a + m.done, 0), right = ms.reduce((a, m) => a + m.right, 0);
  return `<div class="mod" style="cursor:default"><div class="r1"><b>MCE 准入<span class="tag grp">${ms.length} 个子模块</span></b><span>${cnt} 题</span></div>
  <div class="r2"><div class="bar"><i style="width:${done / cnt * 100}%"></i></div><span>${done}/${cnt}</span><span>正确率 ${done ? Math.round(right / done * 100) : 0}%</span></div>
  <div class="subs">${ms.map(m => `<span onclick="act('enterMod',${m.i})">${esc(m.name.replace('MCE准入-', ''))} ${m.count}</span>`).join('')}</div></div>`;
}
function scrHome(st) {
  const s = stats(st), pct = s.done ? Math.round(s.right / s.done * 100) : 0;
  const lp = st.lastPos && st.lastPos.role === st.role ? st.lastPos : null;
  let mods = '';

    const zr = s.mods.filter(m => m.name.startsWith('MCE准入'));
    s.mods.filter(m => !m.name.startsWith('MCE准入')).forEach(m => { mods += modCard(m); if (m.name === 'HR相关题目') mods += grpCard(zr); });
  } else s.mods.forEach(m => { mods += modCard(m); });
  return `<div class="hero"><h2>${ROLE_NAME[st.role]}题库</h2><p>演示版 · 共 ${s.total} 题 · ${DATA.modules[st.role].length} 个模块</p>

    case 'sheetF': S.sheetF = v; break;
    case 'jump': S.idx = v; S.sheet = false; savePos(); break;
    case 'star': S.star[v] = !S.star[v]; save(); toastMsg(S.star[v] ? '已收藏' : '已取消收藏'); break;
    case 'back': back(); break;
    case 'setMod': { const i = S.setup.mods.indexOf(v); if (i >= 0) S.setup.mods.splice(i, 1); else S.setup.mods.push(v); break; }
    case 'setN': S.setup.n = v === 'all' ? 'all' : +v; break;
    case 'setTimer': S.setup.timer = !S.setup.timer; break;
    case 'startExam': { const l = setupList(S); S.exam = { list: l, ans: {}, start: Date.now() }; Object.assign(S, { list: l, idx: 0, mode: 'exam', page: 'quiz', sheet: false, sheetF: 'all', module: null }); break; }
    case 'finishExam': {
      const un = S.exam.list.filter(id => !hasAns(QMAP[id], S.exam.ans[id])).length;
      if (un && !confirm(`还有 ${un} 题未作答，确定交卷？`)) return;
      finishExam(); break;
    }
    case 'reviewQ': Object.assign(S, { page: 'quiz', mode: 'review', list: S.exam.list, idx: S.exam.list.indexOf(v), sheet: false }); break;
    case 'redoExamWrong': enterList(S.exam.result.wrong, 'practice', null); break;
    case 'enterWrong': { const ids = wrongList(S).map(q => q.id); enterList(ids, 'practice', null, v ? ids.indexOf(v) : 0); break; }
    case 'clear': if (!confirm('清除本机全部学习记录？')) return; S.rec = {}; S.star = {}; S.lastPos = null; save(); toastMsg('已清除'); break;
    case 'copy': copyLink(); return;
    case 'saveqr': toastMsg('二维码图片已保存（原型）'); break;
    case 'report': toastMsg('演示版暂未开放纠错，请直接反馈给项目组'); break;
    case 'feedback': toastMsg('演示版暂未开放问卷，请直接反馈给项目组'); break;
  }
  render();
}

function copyLink() {
  const url = location.href.split('#')[0];
  const done = () => { toastMsg('链接已复制'); render(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => fallback());
  else fallback();
  function fallback() { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) { toastMsg('请长按网址手动复制'); render(); } t.remove(); }
}
function render() {
  const old = document.querySelector('#phone-live .scr');
  const key = S.page + '|' + S.mode + '|' + S.idx + '|' + S.list.length;
  const top = old && render.__key === key ? old.scrollTop : 0;
  $('#phone-live').innerHTML = `<div class="phone">${renderScreen(S)}</div>`;
  const nw = document.querySelector('#phone-live .scr'); if (nw) nw.scrollTop = top;
  render.__key = key;
}
setInterval(() => { const el = document.querySelector('#phone-live #timer'); if (el && S.page === 'quiz' && S.mode === 'exam' && !S.exam.fixed) el.textContent = '⏱ ' + elapsed(S); }, 1000);
load(); render();
</script>
</body>
